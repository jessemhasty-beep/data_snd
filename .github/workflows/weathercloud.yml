name: FTP Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python
        run: python ./scripts/weathercloud.py
